<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OBU AMS - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #123b65, #16804a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .logo {
            display: block;
            width: 110px;
            height: auto;
            margin: 0 auto 15px;
        }

        h1 {
            color: #123b65;
            text-align: center;
            font-size: 23px;
            margin-bottom: 10px;
        }

        h2 {
            color: #16804a;
            text-align: center;
            font-size: 20px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        select, input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #16804a;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #123b65;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #16804a;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #123b65;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- OBU University Logo -->
        <img src="images/obu-logo.png"
             alt="OBU Logo"
             class="logo">

        <h1>ODA BULTUM UNIVERSITY</h1>
        <h2>USER LOGIN</h2>

        <form action="login" method="post">

            <label for="role">Select Your Role:</label>

            <select id="role" name="role" required>
                <option value="">-- Select Role --</option>
                <option value="admin">Admin</option>
                <option value="lecturer">Lecturer</option>
            </select>

            <label for="username">Username / Email:</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username or email"
                autocomplete="username"
                required
            >

            <label for="password">Password:</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button type="submit">LOGIN</button>

        </form>

        <a href="index.html" class="back">Back to Home</a>

        <footer>
            OBU Attendance Management System<br>
            Academic Year 2026
        </footer>

    </div>

</body>
</html>
