<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Lecturer - OBU</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #123b65, #16804a);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .logo {
            width: 95px;
            height: auto;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 25px;
            margin: 8px;
        }

        header h2 {
            font-size: 20px;
            margin: 8px;
        }

        .container {
            max-width: 550px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #123b65;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #16804a;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #16804a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #116638;
        }

        .links {
            text-align: center;
            margin-top: 22px;
        }

        .links a {
            display: inline-block;
            margin: 7px;
            color: #123b65;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px 12px;
                padding: 20px;
            }

            header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<header>

    <img src="images/obu-logo.png"
         alt="OBU Logo"
         class="logo">

    <h1>ODA BULTUM UNIVERSITY</h1>
    <h2>ADD NEW LECTURER</h2>

</header>

<div class="container">

    <form action="lecturers" method="post">

        <input type="hidden" name="action" value="add">

        <label>Full Name:</label>
        <input type="text"
               name="full_name"
               maxlength="100"
               required>

        <label>Email:</label>
        <input type="email"
               name="email"
               required>

        <label>Department:</label>
        <input type="text"
               name="department"
               maxlength="100"
               required>

        <label>Password:</label>
        <input type="password"
               name="password"
               minlength="8"
               required>

        <button type="submit">Save Lecturer</button>

    </form>

    <div class="links">
        <a href="lecturers">View Lecturers</a>
        <br>
        <a href="admin-dashboard.html">Back to Dashboard</a>
        <br>
        <a href="logout">Logout</a>
    </div>

</div>

<footer>
    OBU Attendance Management System<br>
    Academic Year 2026
</footer>

</body>
</html>
