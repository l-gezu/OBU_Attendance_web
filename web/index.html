<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OBU Attendance Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #123456, #245987);
            color: white;
            text-align: center;
            padding: 35px 15px;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            background: white;
            padding: 5px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        header h1 {
            margin-bottom: 12px;
            font-size: 28px;
        }

        header p {
            font-size: 17px;
            letter-spacing: 1px;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 35px 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        h2 {
            color: #123456;
            margin-bottom: 18px;
        }

        .welcome {
            margin-bottom: 28px;
            line-height: 1.8;
            font-size: 16px;
        }

        .login-button {
            display: inline-block;
            background: #16804a;
            color: white;
            padding: 13px 35px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #105d36;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: white;
            background: #123456;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 22px;
            }

            header p {
                font-size: 14px;
            }

            .container {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="images/obu-logo.png"
             class="logo" alt="OBU Logo">

        <h1>ODA BULTUM UNIVERSITY</h1>
        <p>ATTENDANCE MANAGEMENT SYSTEM</p>
    </header>

    <div class="container">

        <h2>Welcome to OBU AMS</h2>

        <p class="welcome">
            This system helps manage student information,
            lecturer accounts and student attendance records.
        </p>

        <a href="login.html" class="login-button">Login</a>

    </div>

    <footer>
        <p>Oda Bultum University | Ethiopia | 2026</p>
    </footer>

</body>
</html>
